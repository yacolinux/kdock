# kdock CI. Corre exactamente lo mismo que `tests/run.sh` en local: los tiers
# static + unit + qml. El tier `live` queda afuera por su label — necesita la
# sesión Wayland del usuario y KWin, que en un runner no existen.
#
# Va en un container en vez del runner pelado porque el proyecto pide Qt >= 6.5 y
# ubuntu-24.04 trae 6.4.2. Arch tiene Qt 6.8+ con los headers privados
# (CorePrivate / WaylandClientPrivate) y qtwaylandscanner, que es justo lo que
# hace falta y lo que las imágenes "slim" no traen.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Instalar dependencias
        run: |
          pacman -Syu --noconfirm \
            base-devel cmake ninja git python \
            qt6-base qt6-declarative qt6-wayland qt6-tools \
            xorg-server-xvfb xorg-xauth xorg-xwininfo dbus
          # xorg-xauth va explícito: xvfb-run lo NECESITA (arma un .Xauthority
          # para el display nuevo) y en Arch xorg-server-xvfb no lo arrastra, a
          # diferencia de Debian/Ubuntu.
          # Arch instala los binarios de Qt6 en /usr/lib/qt6/bin y NO los enlaza a
          # /usr/bin (para no chocar con Qt5), así que qmllint y lupdate no están
          # en el PATH. Los scripts igual los resuelven preguntándole a qmake6
          # (tests/lib/sandbox.sh: kdock_qt_tool), pero dejarlos en el PATH del job
          # es más simple de leer cuando algo falla.
          # (qmake6 puede estar en ese mismo directorio, así que hay fallback.)
          if command -v qmake6 > /dev/null; then
            qmake6 -query QT_INSTALL_BINS >> "$GITHUB_PATH"
          else
            echo /usr/lib/qt6/bin >> "$GITHUB_PATH"
          fi

      - name: Verificar que están las herramientas que usa la suite
        # Sin esto, una herramienta que falta se manifiesta como un test "skipped"
        # (código 77) y la corrida sale verde sin haber probado ese tier.
        run: |
          for tool in cmake ninja qmllint lupdate xvfb-run xauth xwininfo dbus-run-session python3; do
            command -v "$tool" > /dev/null || { echo "falta $tool"; exit 1; }
          done

      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKDOCK_BUILD_TESTS=ON

      - name: Compilar los cinco binarios y los tests
        run: cmake --build build -j

      - name: Tests (static + unit + qml)
        # -LE live: todo menos el tier que necesita la sesión real.
        # --no-tests=error para que un filtro mal escrito no pase como verde.
        run: ctest --test-dir build --output-on-failure --no-tests=error -LE live

      - name: Guardar los logs si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/Testing/
          if-no-files-found: ignore
